<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduAI - 跨课程AI Agent平台</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #f5f8fc 0%, #eaf0f7 100%);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .boot-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .boot-card {
        text-align: center;
        color: #425466;
      }

      .boot-mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: linear-gradient(135deg, #00a8ff, #0078d7);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 24px;
        font-weight: 800;
        box-shadow: 0 16px 32px rgba(0, 120, 215, 0.18);
      }

      .boot-text {
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <div class="boot-card">
          <div class="boot-mark">E</div>
          <div class="boot-text">Starting EduAI...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
