    例如 factorial 函数中，base case 是 n==0 返回 1，recursive case 是返回 n*factorial(n-1)。
    因为 n 每次减 1，所以调用层层收敛并最终结束；否则就会导致无限递归。

- id: grading_eval_good_08
  label: good
  expected_min: 84
  expected_max: 100
  content: |
    Recursion solves a problem by reducing it to a smaller subproblem of the same kind.
    A complete recursive definition needs a base case and a recursive case.
    For example, factorial(0)=1 is the base case, and factorial(n)=n*factorial(n-1) is the recursive case.
    Because n decreases each time, the calls converge to the base case; otherwise the program may recurse forever and overflow the stack.

- id: grading_eval_good_09
  label: good
  expected_min: 85
  expected_max: 100
  content: |
    The key idea of recursion is not simply that a function calls itself, but that each call solves a smaller instance of the same problem.
    A sound recursive design must specify a base case to stop and a recursive step to reduce problem size.
    In tree traversal, for example, reaching an empty node is the base case, and visiting child nodes is the recursive step.
    Without a stopping condition or size reduction, recursion will not converge.

- id: grading_eval_good_10
  label: good
  expected_min: 84
  expected_max: 100
  content: |
    A high-quality explanation of recursion should include the definition, the base case, the recursive case, and the reason the parameters approach termination.
    In factorial, the base case is n==0 returning 1, and the recursive case is n*factorial(n-1).
    Since n becomes smaller on each call, the computation eventually reaches the base case and returns safely.

- id: grading_eval_good_11
  label: good
  expected_min: 86
  expected_max: 100
  content: |
    Recursion is a problem-solving method in which a function handles a problem by delegating a smaller problem of the same form to itself.
    To be correct, the definition must contain a base case, a recursive case, and a guarantee that each step moves toward the base case.
    Hanoi Tower, factorial, and tree traversal all follow this structure.
    If the base case is missing or the problem size does not shrink, the recursion may never terminate.
