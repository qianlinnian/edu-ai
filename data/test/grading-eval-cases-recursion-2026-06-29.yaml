- id: grading_eval_mid_01
  label: mid
  expected_min: 55
  expected_max: 80
  content: |
    递归是函数直接或间接调用自己。设计递归时需要有终止条件，例如 factorial 在 n==0 时返回 1。每次递归调用都会把参数变成 n-1，让问题逐步接近终止条件。不过我这里没有继续展开递归树和复杂度分析。

- id: grading_eval_mid_02
  label: mid
  expected_min: 60
  expected_max: 82
  content: |
    递归通常包含递归式和终止条件。比如求阶乘时可以写成 factorial(n)=n*factorial(n-1)，当 n=0 时结束。这样每次都会让问题规模变小。不过我的说明比较简略，没有具体解释为什么如果没有终止条件会出错。

- id: grading_eval_mid_03
  label: mid
  expected_min: 58
  expected_max: 80
  content: |
    递归是一种把大问题变成小问题的方法，函数会调用自己。它应该设置一个结束条件，否则可能一直调用下去。以 factorial 为例，可以一直减 1 直到 0。不过这里我没有完整说明 base case 和 recursive case 的区别。

- id: grading_eval_good_01
  label: good
  expected_min: 82
  expected_max: 100
  content: |
    递归是函数通过调用自身来解决规模更小的同类问题。一个完整的递归定义通常包含两部分：第一，终止条件，也叫 base case，例如 factorial(0)=1；第二，递归步骤，例如 factorial(n)=n*factorial(n-1)。每一次递归调用都必须让参数朝终止条件收敛，否则会导致无限递归和栈溢出。

- id: grading_eval_good_02
  label: good
  expected_min: 85
  expected_max: 100
  content: |
    递归的核心不是简单地“调用自己”，而是把原问题拆成结构相同但规模更小的子问题。写递归函数时要明确 base case 和 recursive case：base case 负责停止递归，recursive case 负责推进问题规模，例如把 n 变成 n-1。这样每一层调用都会逼近终止条件，最终回溯得到结果。

- id: grading_eval_good_03
  label: good
  expected_min: 84
  expected_max: 100
  content: |
    以阶乘为例，递归函数可以定义为：当 n==0 时返回 1，否则返回 n*factorial(n-1)。这里既有终止条件，也有递归推进过程。递归设计的关键是保证每一步都朝 base case 收敛；如果没有这一点，就会产生无限递归和栈溢出。因此，递归是“自调用 + 终止条件 + 规模收敛”的组合。
