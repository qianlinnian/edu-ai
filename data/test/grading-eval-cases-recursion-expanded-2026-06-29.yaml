- id: grading_eval_mid_07
  label: mid
  expected_min: 62
  expected_max: 82
  content: |
    递归是程序设计中常见的方法，函数可以通过调用自己来解决问题。写递归时要保证有终止条件，并让参数向终止条件靠近。
    如果没有这两点，就可能无法结束。不过这个答案没有展开完整例子。

- id: grading_eval_good_01
  label: good
  expected_min: 82
  expected_max: 100
  content: |
    递归是函数通过调用自身来解决规模更小的同类问题。一个完整的递归定义通常包含两部分：
    第一，终止条件，也叫 base case，例如 factorial(0)=1；
    第二，递归步骤，例如 factorial(n)=n*factorial(n-1)。
    每一次递归调用都必须让参数向终止条件收敛，否则会导致无限递归和栈溢出。

- id: grading_eval_good_02
  label: good
  expected_min: 85
  expected_max: 100
  content: |
    递归的核心不是简单地“调用自己”，而是把原问题拆成结构相同但规模更小的子问题。
    写递归函数时要明确 base case 和 recursive case：base case 负责停止递归，
    recursive case 负责推进问题规模，例如把 n 变成 n-1。这样每一层调用都会逼近终止条件，最终回溯得到结果。

- id: grading_eval_good_03
  label: good
  expected_min: 84
  expected_max: 100
  content: |
    以阶乘为例，递归函数可以定义为：当 n==0 时返回 1，否则返回 n*factorial(n-1)。
    这里既有终止条件，也有递归推进过程。递归设计的关键是保证每一步都朝 base case 收敛；
    如果没有这一点，就会产生无限递归和栈溢出。因此，递归是“自调用 + 终止条件 + 规模收敛”的组合。

- id: grading_eval_good_04
  label: good
  expected_min: 84
  expected_max: 100
  content: |
    递归是用函数自身求解更小规模同类问题的方法。为了让递归正确执行，必须给出 base case，
    也必须保证 recursive case 会缩小问题规模。比如二叉树遍历时，对左右子树递归调用，
    当结点为空时直接返回；这就是终止条件。没有终止条件或没有规模收敛，递归就会失控。

- id: grading_eval_good_05
  label: good
  expected_min: 86
  expected_max: 100
  content: |
    判断一个递归定义是否合理，可以看三点：是否明确说明了问题本身是什么，
    是否存在可以直接求解的 base case，是否保证每次递归都把问题规模继续缩小。
    例如 factorial(n) 在 n==0 时返回 1，其余情况返回 n*factorial(n-1)。
    这说明递归不是机械重复，而是有边界、有推进方向的分解过程。

- id: grading_eval_good_06
  label: good
  expected_min: 84
  expected_max: 100
  content: |
    递归函数由递归出口和递归体组成。递归出口负责终止调用，递归体负责把当前问题转化为规模更小的同类问题。
    比如汉诺塔、树遍历、阶乘都可以用这种思想描述。若递归出口缺失，程序可能无限调用并最终栈溢出；
    若规模没有缩小，也不能保证递归收敛。

- id: grading_eval_good_07
  label: good
  expected_min: 85
  expected_max: 100
  content: |
    一个高质量的递归说明至少应包括：递归的定义、base case、recursive case、以及参数如何趋近 base case。
    例如 factorial 函数中，base case 是 n==0 返回 1，recursive case 是返回 n*factorial(n-1)。
    因为 n 每次减 1，所以调用层层收敛并最终结束；否则就会导致无限递归。
